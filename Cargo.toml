[package]
name = "rust-overlay"
version = "0.1.0"
edition = "2024"
description = "A Raycast-style launcher overlay for macOS, written in Rust directly against AppKit"
repository = "https://github.com/aeterno-ryan/rust-overlay"

[dependencies]
dispatch2 = "0.3.1"
global-hotkey = "0.10.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
